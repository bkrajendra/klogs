<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>klogs</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header>
  <h1>klogs</h1>
  <div class="pickers">
    <label>Context
      <select id="context-select"></select>
    </label>
    <label>Namespace
      <select id="namespace-select"></select>
    </label>
  </div>
</header>

<main>
  <section id="workloads-pane">
    <h2>Workloads</h2>
    <table id="workloads-table">
      <thead><tr><th>Kind</th><th>Name</th><th>Ready</th></tr></thead>
      <tbody></tbody>
    </table>
  </section>

  <section id="tabs-pane">
    <div id="tab-bar"></div>
    <div id="tab-content"></div>
  </section>
</main>

<template id="workload-row-template">
  <tr class="workload-row">
    <td class="w-kind"></td>
    <td class="w-name"></td>
    <td class="w-ready"></td>
  </tr>
  <tr class="pods-row" hidden>
    <td colspan="3"><div class="pods-list"></div></td>
  </tr>
</template>

<template id="log-tab-template">
  <div class="log-tab">
    <div class="log-toolbar">
      <span class="log-title"></span>
      <label>Tail lines <input type="number" class="tail-lines" placeholder="all" min="1"></label>
      <label><input type="checkbox" class="previous-toggle"> previous</label>
      <button class="autoscroll-toggle" title="Toggle autoscroll">autoscroll: on</button>
      <button class="clear-btn">clear</button>
      <button class="download-btn">download</button>
      <button class="close-btn">close</button>
      <span class="log-status"></span>
    </div>
    <pre class="log-view"></pre>
  </div>
</template>

<script src="/app.js"></script>
</body>
</html>
